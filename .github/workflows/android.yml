name: Build PlayBox Android APK and demo ELF
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build PlayBox demo ELF
        run: |
          mkdir -p dist
          as --64 samples/PlayBox.S -o /tmp/playbox-demo.o
          ld -static -nostdlib -Ttext=0x400000 -e _start -o dist/PlayBox.elf /tmp/playbox-demo.o
          file dist/PlayBox.elf
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PlayBox-v0.2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/PlayBox.elf
